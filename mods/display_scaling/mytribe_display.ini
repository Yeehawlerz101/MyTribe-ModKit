; My Tribe Display Scaling Mod Configuration
; Hotkeys in-game:
;   F11 or Alt+Enter : Toggle Borderless Fullscreen / Resizable Window
;   F9               : Toggle Filter (linear / nearest)
;   F10              : Cycle Aspect Mode (fit / integer / stretch)

[Display]
; mode: auto (follows in-game Full Screen setting using borderless native / large window),
;       windowed (always start windowed), borderless (always start borderless fullscreen)
mode = auto

; Initial window size in windowed mode (0 = auto-size to ~85% of screen height at 4:3)
window_width = 0
window_height = 0

; aspect: fit (exact 4:3 with black bars), integer (largest integer multiple), stretch
aspect = stretch

; filter: linear (smooth bilinear) or nearest (crisp pixels)
filter = linear

; vsync: 1 = enabled, 0 = disabled
vsync = 1

; unlock_mouse_in_windowed: 1 = allow cursor to leave window freely in windowed mode
unlock_mouse_in_windowed = 1

; log: 1 = write mytribe_display.log, 0 = disable logging
log = 1
